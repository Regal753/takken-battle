name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node Audit-TakkenFullExam.js
      - run: node Audit-TakkenCaseExamBank.js
      - run: node Audit-TakkenChapter2Range.js
      - run: node Audit-TakkenTextbookRanges.js
      - run: node Audit-TakkenQuestionQuality.js
      - run: node Audit-TakkenExplanationMastery.js
      - run: node Audit-TakkenUnderstandingDepth.js
      - run: node Audit-Takken2026Coverage.js
      - run: node Audit-TakkenPracticalVariations.js
      - run: node Audit-TakkenQuestionBank.js
      - run: node Audit-TakkenRewardSystem.js
      - run: node Audit-TakkenOfficialDrill.js
      - run: node Audit-TakkenOfficialExamData.js
      - run: node Audit-TakkenSaveStore.js
      - run: node Audit-TakkenSaveTransfer.js
      - run: node Audit-TakkenCalculationDrill.js
      - run: node Audit-TakkenLearningArchitecture.js
      - run: node Audit-TakkenBusinessFullScoreSupplement.js
      - run: node Audit-TakkenBusinessFullScoreBank.js
      - run: node Audit-TakkenGuaranteeAssociationDrill.js
      - run: node Audit-TakkenBusinessMastery.js
      - run: node Audit-TakkenBusinessKnock.js
      - run: node Audit-TakkenBusinessHardBank.js
      - run: node Audit-TakkenBusinessPace.js
      - run: node Audit-TakkenOfficialLawBaseline.js
      - run: node Audit-TakkenStateSync.js
      - run: node Audit-TakkenRestrictionsSupplement.js
      - run: node Audit-TakkenRestrictionsAuthored.js
      - run: node Audit-TakkenTaxAuthored.js
      - run: node Audit-TakkenBusinessPolish.js
      - run: node Audit-TakkenSubjectSprintBank.js
      - run: node Audit-TakkenVocabularyBank.js
      - run: node Audit-TakkenPassReadiness.js
      - run: node Audit-TakkenLearningEffectiveness.js
      - run: node Audit-TakkenDailyCoverage.js
      - run: node Audit-TakkenExamCurrentYear2026.js
      - run: node Audit-TakkenOfficialTopicMap.js
      - run: node Audit-TakkenPublicPerformance.js
      - run: node Audit-TakkenReleaseIntegrity.js
      - run: node Audit-TakkenCurrentLawSources.js
      - run: node Audit-TakkenReiwaExamBank.js
      - run: node Audit-TakkenReiwaQuestionView.js
      - run: node Audit-TakkenBrowserCi.js
      - run: node Audit-TakkenPwaLifecycle.js
      - run: node scripts/validate-public.mjs

  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned Playwright runtime
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Fetch immutable save compatibility baselines
        if: matrix.shard == 'b'
        shell: bash
        run: |
          # Squash merges delete the PR branch; these fixed runtimes must also
          # be available in the shallow main checkout after publication.
          for revision in a65ed1a0da87d1fb27b497e5f0b060bc4243a5e5 1b552fe1366bd43fc106bd16ba663853b03cd9e5; do
            git fetch --no-tags --depth=1 origin "$revision"
            git cat-file -e "$revision:app.js"
          done
      - name: Fetch published vocabulary schema18 baseline
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin ebc5a046d0764d90a4bea36303ac87005687b0f5
          git cat-file -e ebc5a046d0764d90a4bea36303ac87005687b0f5:app.js
          git cat-file -e ebc5a046d0764d90a4bea36303ac87005687b0f5:vocabulary-bank.js
      - name: Run critical browser audits
        shell: bash
        env:
          TAKKEN_BASE_URL: http://127.0.0.1:8783/
          TAKKEN_CHROME_PATH: /usr/bin/google-chrome
          TAKKEN_AUDIT_SHARD: ${{ matrix.shard }}
          TAKKEN_SCHEMA18_APP_REF: ebc5a046d0764d90a4bea36303ac87005687b0f5
        run: |
          set -euo pipefail
          google-chrome --version
          python3 -m http.server 8783 --bind 127.0.0.1 >/tmp/takken-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$TAKKEN_BASE_URL" >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --show-error "$TAKKEN_BASE_URL" >/dev/null
          node scripts/run-browser-audits.cjs --shard "$TAKKEN_AUDIT_SHARD"

      - name: Verify mobile PWA reconnect update and save retention
        if: matrix.shard == 'b'
        env:
          TAKKEN_CHROME_PATH: /usr/bin/google-chrome
          TAKKEN_PWA_LEGACY_REF: ebc5a046d0764d90a4bea36303ac87005687b0f5
        run: |
          node Audit-TakkenPwaUpgrade.cjs --auto-reconnect
          node Audit-TakkenPwaUpgrade.cjs --multi-tab
          node Audit-TakkenPwaUpgrade.cjs --save-failure

  validate:
    if: ${{ always() }}
    needs:
      - static
      - browser
    runs-on: ubuntu-latest
    steps:
      - name: Require static and browser audits
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
