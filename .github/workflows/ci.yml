name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node Audit-TakkenFullExam.js
      - run: node Audit-TakkenChapter2Range.js
      - run: node Audit-TakkenTextbookRanges.js
      - run: node Audit-TakkenQuestionQuality.js
      - run: node Audit-TakkenExplanationMastery.js
      - run: node Audit-TakkenUnderstandingDepth.js
      - run: node Audit-Takken2026Coverage.js
      - run: node Audit-TakkenPracticalVariations.js
      - run: node Audit-TakkenQuestionBank.js
      - run: node Audit-TakkenRewardSystem.js
      - run: node Audit-TakkenOfficialDrill.js
      - run: node Audit-TakkenOfficialExamData.js
      - run: node Audit-TakkenSaveStore.js
      - run: node Audit-TakkenSaveTransfer.js
      - run: node Audit-TakkenCalculationDrill.js
      - run: node Audit-TakkenLearningArchitecture.js
      - run: node Audit-TakkenBusinessFullScoreSupplement.js
      - run: node Audit-TakkenBusinessFullScoreBank.js
      - run: node Audit-TakkenBusinessMastery.js
      - run: node Audit-TakkenBusinessKnock.js
      - run: node Audit-TakkenBusinessPace.js
      - run: node Audit-TakkenOfficialLawBaseline.js
      - run: node Audit-TakkenStateSync.js
      - run: node Audit-TakkenSubjectSprintBank.js
      - run: node Audit-TakkenPassReadiness.js
      - run: node Audit-TakkenExamCurrentYear2026.js
      - run: node Audit-TakkenOfficialTopicMap.js
      - run: node Audit-TakkenPublicPerformance.js
      - run: node scripts/validate-public.mjs

  browser:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned Playwright runtime
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Run critical browser audits
        shell: bash
        env:
          TAKKEN_BASE_URL: http://127.0.0.1:8783/
          TAKKEN_CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          google-chrome --version
          python3 -m http.server 8783 --bind 127.0.0.1 >/tmp/takken-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$TAKKEN_BASE_URL" >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent --show-error "$TAKKEN_BASE_URL" >/dev/null
          node Audit-TakkenBusinessMasteryUi.cjs
          node Audit-TakkenStatementReviewUi.cjs
          node Audit-TakkenBalancedExplanationUi.cjs
          node Audit-TakkenBusinessKnockUi.cjs
          node Audit-TakkenFullExamUi.cjs
          node Audit-TakkenPassReadinessUi.cjs
          node Audit-TakkenCalculationDrillUi.cjs
          node Audit-TakkenPassPlanUi.cjs
          node Audit-TakkenPassLoopV12Ui.cjs
          node Audit-TakkenPwaOffline.cjs

  validate:
    if: ${{ always() }}
    needs:
      - static
      - browser
    runs-on: ubuntu-latest
    steps:
      - name: Require static and browser audits
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
