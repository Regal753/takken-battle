name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node Audit-TakkenFullExam.js
      - run: node Audit-TakkenChapter2Range.js
      - run: node Audit-TakkenTextbookRanges.js
      - run: node Audit-TakkenQuestionQuality.js
      - run: node Audit-TakkenExplanationMastery.js
      - run: node Audit-TakkenUnderstandingDepth.js
      - run: node Audit-Takken2026Coverage.js
      - run: node Audit-TakkenPracticalVariations.js
      - run: node Audit-TakkenQuestionBank.js
      - run: node Audit-TakkenRewardSystem.js
      - run: node Audit-TakkenOfficialDrill.js
      - run: node Audit-TakkenOfficialExamData.js
      - run: node Audit-TakkenSaveStore.js
      - run: node Audit-TakkenSaveTransfer.js
      - run: node Audit-TakkenCalculationDrill.js
      - run: node Audit-TakkenLearningArchitecture.js
      - run: node Audit-TakkenBusinessFullScoreSupplement.js
      - run: node Audit-TakkenBusinessFullScoreBank.js
      - run: node Audit-TakkenBusinessMastery.js
      - run: node Audit-TakkenBusinessKnock.js
      - run: node Audit-TakkenBusinessPace.js
      - run: node Audit-TakkenOfficialLawBaseline.js
      - run: node Audit-TakkenStateSync.js
      - run: node Audit-TakkenPublicPerformance.js
      - run: node scripts/validate-public.mjs
      - name: Assemble static site
        shell: bash
        run: |
          mkdir _site
          cp index.html styles.css app.js business-mastery.js business-knock.js business-pace.js business-fullscore-supplement.js business-fullscore-bank.js practical-question-bank.js calculation-drill.js official-exam-data.js official-law-baseline.js save-store.js save-transfer.js state-sync.js reward-system.js question-bank.js question-balance.js exam-blueprint.js exam-question-core.js exam-questions-rights.js exam-questions-restrictions.js exam-questions-tax-other.js exam-questions-business.js _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify deployed page
        run: node scripts/verify-deployed-page.mjs "${{ steps.deployment.outputs.page_url }}" "20260816-premise-readability-v28-1"
